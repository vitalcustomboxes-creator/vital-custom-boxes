name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Test-only values; production credentials are not needed in CI.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: "local-build-placeholder"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "local-build"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "local-build.firebaseapp.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Content validation
        run: node scripts/validate-content.mjs

      - name: Production build
        run: npm run build

      - name: Performance budget
        run: node scripts/check-budgets.mjs

      - name: Smoke tests
        run: node scripts/smoke.mjs

      - name: QA crawl
        run: node scripts/qa-crawl.mjs